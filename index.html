<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEMEFORGE — make memes that slap</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#C8F02C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Anton&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Anton&display=swap" rel="stylesheet" /></noscript>
    <script>
      (function () {
        var t = localStorage.getItem('mf-theme') || 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      :root { --bg: #F2EEE5; --lime: #C8F02C; --ink: #0E0E0E; }
      [data-theme="dark"] { --bg: #1C1A14; --lime: #C8F02C; --ink: #F2EEE5; }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); min-height: 100vh; }
      .splash {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: var(--bg); z-index: 999;
      }
      .splash .tag {
        font-family: "Anton", "Impact", sans-serif; font-size: 64px;
        letter-spacing: 2px; border: 3px solid var(--ink);
        padding: 8px 22px; background: var(--lime);
        box-shadow: 6px 6px 0 0 var(--ink); transform: rotate(-2deg);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash"><div class="tag">MEMEFORGE</div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
